name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --filter @lattice/desktop exec playwright install --with-deps chromium

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Rust Check
        run: cargo check --workspace

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Web Build
        run: pnpm build:web

      - name: Tauri Build Validation
        run: pnpm --filter @lattice/desktop tauri:build

      - name: E2E
        run: pnpm e2e
