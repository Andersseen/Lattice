name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bun --filter @lattice/desktop playwright install --with-deps chromium

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit Tests
        run: bun run test

      - name: Rust Check
        run: cargo check --workspace

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Web Build
        run: bun run build:web

      - name: Tauri Build Validation
        run: bun --filter @lattice/desktop tauri:build

      - name: E2E
        run: bun run e2e
