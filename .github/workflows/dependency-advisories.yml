name: Dependency Advisories

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - apps/**/package.json
      - packages/**/package.json
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - apps/**/Cargo.toml
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-advisories:
    name: Dependency Advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: JavaScript Advisories
        run: bun audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust Advisories
        run: cargo audit --deny yanked
