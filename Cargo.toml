[workspace]
members = ["apps/desktop/src-tauri", "crates/lattice-core"]
resolver = "2"

[workspace.package]
authors = ["Lattice contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/andersseen/lattice"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[workspace.dependencies]
lattice-core = { path = "crates/lattice-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-log = "2.9.1"
thiserror = "2.0"
