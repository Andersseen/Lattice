<section class="system" aria-labelledby="system-title">
  <p class="eyebrow">Architecture boundary</p>
  <h1 id="system-title">Angular talks to Lattice core through a typed bridge.</h1>

  <ol>
    <li>Angular owns presentation and interaction state.</li>
    <li>The application API defines small typed commands.</li>
    <li>Tauri IPC crosses into Rust.</li>
    <li>Rust owns native capabilities and future adapters.</li>
  </ol>
</section>
